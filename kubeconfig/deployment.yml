apiVersion: apps/v1
kind: Deployment
metadata:
  name: myms-deployment
  labels:
    app: myms
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myms
  template:
    metadata:
      labels:
        app: myms
    spec:
      containers:
        - name: myms
          image: ghcr.io/myms/myms:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          imagePullPolicy: Always
